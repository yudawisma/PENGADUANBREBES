version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: laporbrebes_mysql
    restart: always
    environment:
      MYSQL_DATABASE: 'laporbrebes'
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes' 
    ports:
      - '3306:3306'
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laporbrebes_phpmyadmin
    restart: always
    ports:
      - '8080:80'
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ''

volumes:
  db_data: